<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>slabika — revízia korpusu</title>
<style>
  :root {
    --bg: #14161a; --panel: #1b1e24; --line: #2c313a; --text: #e6e8ec;
    --dim: #8b93a1; --accent: #7cc4ff; --good: #64d18a; --bad: #ff7b72;
    --warn: #e3b341; --grey: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; height: 100vh;
         display: grid; grid-template-rows: auto auto 1fr auto; }

  header { border-bottom: 1px solid var(--line); padding: 8px 12px;
           display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], select, button {
           background: var(--panel); border: 1px solid var(--line);
           color: var(--text); padding: 6px 9px; border-radius: 6px;
           font-size: 14px; font-family: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #q { width: 220px; }
  #q:focus, select:focus { outline: none; border-color: var(--accent); }
  .stat { color: var(--dim); font-size: 12.5px; }
  .stat b { color: var(--text); font-weight: 600; }
  .spacer { flex: 1; }

  .grid { display: grid;
          grid-template-columns: 46px 148px 196px 190px 78px;
          gap: 0 8px; align-items: center; max-width: 720px; }
  .head { border-bottom: 1px solid var(--line); padding: 5px 12px;
          color: var(--dim); font-size: 11.5px; text-transform: uppercase;
          letter-spacing: .8px; }

  #rows { overflow-y: auto; }
  .row { padding: 2px 12px 2px 8px; border-left: 4px solid transparent; }
  .row:nth-child(even) { background: #171a1f; }
  .row.ai-diff { background: #33191c; }
  .row.ai-diff:nth-child(even) { background: #3a1c20; }
  .row.focus { background: #222a37; }
  .row.d-confirm { border-left-color: var(--good); }
  .row.d-correct { border-left-color: var(--warn); }
  .row.d-flag { border-left-color: var(--bad); }
  .row.d-uncertain { border-left-color: var(--accent); }
  .row.d-invalid { border-left-color: var(--grey); }

  .idx { color: var(--dim); font-size: 11.5px; text-align: right;
         font-variant-numeric: tabular-nums; }
  .form { font-family: Cambria, Georgia, serif; font-size: 15px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .edit { width: 100%; font-family: Consolas, "Cascadia Mono", monospace;
          font-size: 14px; letter-spacing: .2px; padding: 3px 6px; }
  .edit.diff { border-color: var(--warn); color: var(--warn); }
  .edit.bad { border-color: var(--bad); color: var(--bad); }
  .edit:focus { outline: none; border-color: var(--accent); }
  .state { font-size: 11.5px; color: var(--dim); white-space: nowrap;
           overflow: hidden; text-overflow: ellipsis; }
  .state b { font-weight: 600; }
  .acts { display: flex; gap: 3px; }
  .acts button { padding: 2px 7px; font-size: 12px; line-height: 1.3; }

  footer { border-top: 1px solid var(--line); padding: 7px 12px;
           color: var(--dim); font-size: 12px; display: flex; gap: 14px;
           flex-wrap: wrap; align-items: center; }
  kbd { background: var(--panel); border: 1px solid var(--line);
        border-bottom-width: 2px; border-radius: 4px; padding: 0 5px;
        font-family: inherit; color: var(--text); font-size: 11.5px; }
  #toast { position: fixed; right: 16px; bottom: 46px; background: var(--panel);
           border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
           opacity: 0; transition: opacity .2s; max-width: 46vw; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <input type="text" id="q" placeholder="filter…  (/)" autocomplete="off">
  <select id="mode" title="kde sa hľadá">
    <option value="prefix">od začiatku</option>
    <option value="any">kdekoľvek v slove</option>
    <option value="suffix">na konci</option>
    <option value="exact">presne</option>
    <option value="regex">regex</option>
  </select>
  <select id="status" title="ktoré slová ukázať">
    <option value="all">všetko</option>
    <option value="undecided">ešte neskontrolované</option>
    <option value="mine">už som rozhodol</option>
    <option value="correct">moje opravy</option>
    <option value="flag">⚑ označené ako zlé</option>
    <option value="confirm">potvrdené</option>
    <option value="uncertain">neviem</option>
    <option value="invalid">nie je slovo</option>
    <option value="engine_disagree">moje ≠ engine</option>
    <option value="ai_disagree">AI navrhla iné delenie</option>
    <option value="human_review">AI: iné delenie alebo neistota</option>
    <option value="verified">overené ľuďmi (import)</option>
    <option value="engine_error">engine spadol</option>
  </select>
  <select id="field" title="čo sa edituje v riadkoch">
    <option value="h">delenie slov</option>
    <option value="s">slabiky</option>
  </select>
  <select id="limit" title="koľko riadkov naraz">
    <option>200</option><option selected>500</option>
    <option>1000</option><option>2000</option>
  </select>
  <button id="bulk" title="potvrdí všetky nedotknuté riadky na tejto strane">✓ potvrdiť zvyšok strany</button>
  <button id="undo" title="Alt+Z">↶ späť</button>
  <div class="spacer"></div>
  <span class="stat" id="totals"></span>
</header>

<div class="grid head">
  <span style="text-align:right">#</span>
  <span>tvar</span>
  <span id="head-edit">návrh delenia — oprav pomlčky a stlač Enter</span>
  <span>stav</span>
  <span>akcia</span>
</div>

<div id="rows"></div>

<footer>
  <span><kbd>Enter</kbd> ulož + ďalší</span>
  <span><kbd>Shift</kbd>+<kbd>Enter</kbd> ulož + predošlý</span>
  <span><kbd>Esc</kbd> vráť návrh enginu</span>
  <span><kbd>↑</kbd><kbd>↓</kbd> riadok</span>
  <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> ⚑ je to zle</span>
  <span><kbd>Ctrl</kbd>+<kbd>Del</kbd> zruš rozhodnutie</span>
  <span><kbd>Alt</kbd>+<kbd>Z</kbd> späť</span>
  <span><kbd>/</kbd> filter</span>
  <span class="spacer"></span>
  <span class="stat" id="store"></span>
  <span class="stat" id="count"></span>
  <button id="prev">←</button><button id="next">→</button>
</footer>

<div id="toast"></div>

<script>
const S = {
  items: [], total: 0, offset: 0, limit: 500, focus: 0,
  q: "", mode: "prefix", status: "all", field: "h",
};

const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
const dash = s => (s || "").replace(/·/g, "-");
const toast = msg => {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
};

async function api(path, body) {
  const r = await fetch(path, body ? {method: "POST", body: JSON.stringify(body)} : {});
  return r.json();
}

const engineText = it => dash(S.field === "h" ? it.hyphenation : it.syllabification);
const mineText = it => dash(S.field === "h" ? it.my_expected : it.my_syllabification);

// -- rendering ---------------------------------------------------------

const LABEL = {confirm: ["potvrdené", "var(--good)"], correct: ["opravené", "var(--warn)"],
               flag: ["⚑ je to zle", "var(--bad)"], uncertain: ["neviem", "var(--accent)"],
               invalid: ["nie je slovo", "var(--grey)"]};

function paint(row, it) {
  const input = row.querySelector(".edit");
  row.className = "row grid" + (it.my_action ? " d-" + it.my_action : "") +
                  (it.ai_disagrees ? " ai-diff" : "") +
                  (row._i === S.focus ? " focus" : "");
  input.classList.toggle("diff", input.value !== engineText(it));
  input.classList.remove("bad");

  const parts = [];
  if (it.my_action) {
    const [text, colour] = LABEL[it.my_action];
    parts.push(`<b style="color:${colour}">${text}</b>`);
  }
  if (it.stale) parts.push(`<span style="color:var(--bad)">engine sa zmenil</span>`);
  if (it.ai_disagrees)
    parts.push(`<b style="color:var(--bad)">AI: ${esc(dash(it.ai_expected))}</b>`);
  if (it.engine_error) parts.push(`<span style="color:var(--bad)">engine spadol</span>`);
  row.querySelector(".state").innerHTML = parts.join(" · ") || "—";
}

function makeRow(it, i) {
  const row = document.createElement("div");
  row._i = i;
  row.innerHTML =
    `<span class="idx">${S.offset + i + 1}</span>` +
    `<span class="form" title="${esc(it.form)}">${esc(it.form)}</span>` +
    `<input class="edit" spellcheck="false" autocomplete="off">` +
    `<span class="state"></span>` +
    `<span class="acts">` +
      `<button data-a="flag" title="je to zle (Ctrl+Enter)">⚑</button>` +
      `<button data-a="uncertain" title="neviem">?</button>` +
      `<button data-a="invalid" title="nie je to slovo">✗</button>` +
      `<button data-a="clear" title="zruš moje rozhodnutie (Ctrl+Delete)">↺</button>` +
    `</span>`;

  const input = row.querySelector(".edit");
  input.value = input._committed = mineText(it) || engineText(it);
  input.addEventListener("input", () => paint(row, it));
  input.addEventListener("focus", () => { S.focus = i; markFocus(); });
  input.addEventListener("blur", () => {
    if (input.value !== input._committed) save(i, 0);
  });
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") {
      ev.preventDefault();
      if (ev.ctrlKey) act(i, "flag"); else save(i, ev.shiftKey ? -1 : 1);
    } else if (ev.key === "Delete" && ev.ctrlKey) {
      ev.preventDefault(); act(i, "clear");
    } else if (ev.key === "Escape") {
      ev.preventDefault(); input.value = engineText(it); paint(row, it);
    } else if (ev.key === "ArrowDown") {
      ev.preventDefault(); focusRow(i + 1);
    } else if (ev.key === "ArrowUp") {
      ev.preventDefault(); focusRow(i - 1);
    }
  });
  row.querySelectorAll(".acts button").forEach(b =>
    b.addEventListener("click", () => act(i, b.dataset.a)));

  paint(row, it);
  return row;
}

function markFocus() {
  const box = $("rows");
  [...box.children].forEach((c, n) => c.classList.toggle("focus", n === S.focus));
}

function focusRow(i) {
  if (i < 0) { if (S.offset > 0) load(S.offset - S.limit, "end"); return; }
  if (i >= S.items.length) {
    if (S.offset + S.items.length < S.total) load(S.offset + S.limit);
    else toast("koniec výberu");
    return;
  }
  S.focus = i;
  const row = $("rows").children[i];
  row.scrollIntoView({block: "nearest"});
  row.querySelector(".edit").focus();
  markFocus();
}

function renderAll() {
  const box = $("rows");
  box.innerHTML = "";
  const frag = document.createDocumentFragment();
  S.items.forEach((it, i) => frag.appendChild(makeRow(it, i)));
  box.appendChild(frag);
  const from = S.total ? S.offset + 1 : 0;
  $("count").innerHTML =
    `<b>${S.total.toLocaleString("sk")}</b> zhôd · zobrazené ${from}–${S.offset + S.items.length}`;
}

async function load(offset = 0, focus = 0) {
  const p = new URLSearchParams({q: S.q, mode: S.mode, status: S.status,
                                offset: Math.max(0, offset), limit: S.limit});
  const data = await api("/api/list?" + p);
  if (data.error) { toast(data.error); return; }
  S.items = data.items; S.total = data.total; S.offset = data.offset;
  S.focus = focus === "end" ? Math.max(0, S.items.length - 1) : 0;
  renderAll();
  if (S.items.length) focusRow(S.focus);
  stats();
}

async function stats() {
  const s = await api("/api/stats");
  const pct = (100 * s.decided / s.total).toFixed(2);
  $("totals").innerHTML =
    `korpus <b>${s.total.toLocaleString("sk")}</b> · skontrolované ` +
    `<b>${s.decided.toLocaleString("sk")}</b> (${pct} %) · opravy <b>${s.correct}</b>` +
    ` · ⚑ zlé <b>${s.flag}</b> · neviem <b>${s.uncertain}</b>`;
  const store = $("store");
  store.textContent = "uložené do " + s.decisions_path.split(/[\\/]/).pop();
  store.title = s.decisions_path + "  (engine slabika " + s.engine_version + ")";
}

// -- writing -----------------------------------------------------------

function replaceRow(i, item) {
  S.items[i] = item;
  const old = $("rows").children[i];
  const row = makeRow(item, i);
  old.replaceWith(row);
  return row;
}

async function save(i, step) {
  const it = S.items[i];
  const row = $("rows").children[i];
  const input = row.querySelector(".edit");
  const value = input.value;
  if (input._committed === value && it.my_action) { if (step) focusRow(i + step); return; }
  input._committed = value;
  const r = await api("/api/decide", {
    form: it.form, action: "confirm",
    field: S.field === "h" ? "hyphenation" : "syllabification", text: value,
  });
  if (r.error) { input.classList.add("bad"); toast(r.error); return; }
  const fresh = replaceRow(i, r.item);
  if (step) focusRow(i + step); else { fresh.classList.toggle("focus", i === S.focus); }
  stats();
}

const REASON = {
  flag: "Human console: division is wrong, needs engine work.",
  uncertain: "Human console: reviewer is not sure.",
  invalid: "Human console: not a valid word form.",
};

async function act(i, action) {
  const form = S.items[i].form;
  // Withdrawing a verdict keeps you on the row: you asked to undo it, not to
  // move on, and the row must visibly fall back to the engine's proposal.
  const clearing = action === "clear";
  const r = clearing
    ? await api("/api/clear", {form})
    : await api("/api/decide", {form, action, reason: REASON[action]});
  if (r.error) { toast(r.error); return; }
  if (!r.ok) { toast(r.message); return; }
  replaceRow(i, r.item);
  stats();
  if (clearing) { toast("rozhodnutie zrušené: " + form); focusRow(i); }
  else focusRow(i + 1);
}

async function bulkConfirm() {
  const entries = [];
  [...$("rows").children].forEach((row, i) => {
    const it = S.items[i], value = row.querySelector(".edit").value;
    if (!it.my_action && value === engineText(it)) entries.push({
      form: it.form, action: "confirm",
      field: S.field === "h" ? "hyphenation" : "syllabification", text: value,
    });
  });
  if (!entries.length) { toast("na tejto strane nie je čo potvrdzovať"); return; }
  if (!confirm(`Potvrdiť ${entries.length} nedotknutých riadkov na tejto strane ako správne?`)) return;
  const r = await api("/api/decide_many", {entries});
  if (r.error) { toast(r.error); return; }
  toast(`potvrdených ${r.items.length}` + (r.failed.length ? `, zlyhalo ${r.failed.length}` : ""));
  load(S.offset);
}

async function undo() {
  const r = await api("/api/undo", {});
  if (!r.ok) { toast(r.message || r.error); return; }
  const at = S.items.findIndex(x => x.form === r.form);
  if (at >= 0) replaceRow(at, r.item);
  toast("späť: " + r.form);
  stats();
}

// -- wiring ------------------------------------------------------------

let timer = null;
$("q").addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(() => { S.q = $("q").value.trim(); load(0); }, 180);
});
$("q").addEventListener("keydown", ev => {
  if (ev.key === "Enter") { ev.preventDefault(); focusRow(0); }
});
$("mode").addEventListener("change", () => { S.mode = $("mode").value; load(0); });
$("status").addEventListener("change", () => { S.status = $("status").value; load(0); });
$("limit").addEventListener("change", () => { S.limit = +$("limit").value; load(0); });
$("field").addEventListener("change", () => {
  S.field = $("field").value;
  $("head-edit").textContent = S.field === "h"
    ? "návrh delenia — oprav pomlčky a stlač Enter"
    : "návrh slabík — oprav pomlčky a stlač Enter";
  renderAll();
});
$("bulk").addEventListener("click", bulkConfirm);
$("undo").addEventListener("click", undo);
$("prev").addEventListener("click", () => S.offset > 0 && load(S.offset - S.limit));
$("next").addEventListener("click", () =>
  S.offset + S.items.length < S.total && load(S.offset + S.limit));

document.addEventListener("keydown", ev => {
  if (ev.altKey && (ev.key === "z" || ev.key === "Z")) { ev.preventDefault(); undo(); return; }
  if (ev.key === "/" && ev.target.tagName !== "INPUT") {
    ev.preventDefault(); $("q").focus(); $("q").select();
  }
});

load(0);
</script>
</body>
</html>
