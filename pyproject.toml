[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slabika"
version = "0.4.0"
description = "Slovak syllabification and hyphenation, derived from a full phonological inventory"
readme = "README.md"
requires-python = ">=3.10"
license = "(Apache-2.0 OR MIT) AND (CC0-1.0 OR MIT) AND MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Peter Bezemek", email = "peter.bezemek@gmail.com" }]
keywords = ["slovak", "slovencina", "hyphenation", "syllabification", "phonology", "typography", "patgen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Slovak",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
slabika-review = "slabika.review.server:main"

[project.optional-dependencies]
# Ruff's default rule set changes between minor releases, so an unpinned linter
# makes "checks passed" unreproducible. reuse needs an encoding detector that is
# not installed by default on Windows.
dev = ["pytest>=7", "ruff>=0.15,<0.16", "reuse[charset-normalizer]>=5"]
morph = ["PyMuPDF>=1.24"]

[project.urls]
Homepage = "https://github.com/pietrobb/slabika"
Source = "https://github.com/pietrobb/slabika"
Issues = "https://github.com/pietrobb/slabika/issues"

# The wheel is runtime only: no databases, no tools. The sdist carries the full
# source of truth (corpus, review decisions, blind audits) so patterns can be
# regenerated and the test suite can run from an unpacked archive.
[tool.hatch.build.targets.wheel]
packages = ["src/slabika"]
exclude = ["**/*.sqlite", "**/*.sqlite-*", "**/*.db", "**/*.db-*"]

[tool.hatch.build.targets.wheel.force-include]
"tex/hyph-sk.tex" = "slabika/review/tex/hyph-sk.tex"

[tool.hatch.build.targets.sdist]
exclude = ["/pronunciation", "**/*.sqlite-*", "**/*.db-*"]

[tool.hatch.build.targets.sdist.force-include]
"tex/hyph-sk.tex" = "tex/hyph-sk.tex"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
