[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slabika"
version = "0.1.0"
description = "Slovak syllabification and hyphenation, derived from a full phonological inventory"
readme = "README.md"
requires-python = ">=3.10"
license = "(Apache-2.0 OR MIT) AND (CC0-1.0 OR MIT)"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Peter Bezemek", email = "peter.bezemek@gmail.com" }]
keywords = ["slovak", "slovencina", "hyphenation", "syllabification", "phonology", "typography", "patgen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Slovak",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
slabika-review = "slabika.review.server:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "reuse"]

[project.urls]
Homepage = "https://github.com/pietrobb/slabika"
Source = "https://github.com/pietrobb/slabika"
Issues = "https://github.com/pietrobb/slabika/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/slabika"]

[tool.hatch.build.targets.wheel.force-include]
"tests/data/translatemaster_hyphenation_working.sqlite" = "slabika/review/data/inventory.sqlite"
"tests/data/blind_word_division_5000_v1/results.sqlite" = "slabika/review/data/blind-word-division-5000.sqlite"
"tests/data/blind_human_recheck_100_v1/results.sqlite" = "slabika/review/data/blind-human-recheck-100.sqlite"
"tests/data/blind_human_recheck_1000_v2/results.sqlite" = "slabika/review/data/blind-human-recheck-1000.sqlite"
"tests/data/blind_human_recheck_2000_v3/results.sqlite" = "slabika/review/data/blind-human-recheck-2000.sqlite"
"tex/hyph-sk.tex" = "slabika/review/tex/hyph-sk.tex"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
