[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "slabika"
version = "0.3.0"
description = "Slovak syllabification and hyphenation, derived from a full phonological inventory"
readme = "README.md"
requires-python = ">=3.10"
license = "(Apache-2.0 OR MIT) AND (CC0-1.0 OR MIT) AND MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [{ name = "Peter Bezemek", email = "peter.bezemek@gmail.com" }]
keywords = ["slovak", "slovencina", "hyphenation", "syllabification", "phonology", "typography", "patgen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Slovak",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
slabika-review = "slabika.review.server:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "reuse"]
morph = ["PyMuPDF>=1.24"]

[project.urls]
Homepage = "https://github.com/pietrobb/slabika"
Source = "https://github.com/pietrobb/slabika"
Issues = "https://github.com/pietrobb/slabika/issues"

# Working databases remain local; installed reviewers supply --db explicitly.
[tool.hatch.build.targets.wheel]
packages = ["src/slabika"]
exclude = ["**/*.sqlite", "**/*.sqlite-*", "**/*.db", "**/*.db-*"]

[tool.hatch.build.targets.wheel.force-include]
"tex/hyph-sk.tex" = "slabika/review/tex/hyph-sk.tex"

[tool.hatch.build.targets.sdist]
exclude = ["/pronunciation", "/3", "**/*.sqlite", "**/*.sqlite-*", "**/*.db", "**/*.db-*"]

[tool.hatch.build.targets.sdist.force-include]
"tex/hyph-sk.tex" = "tex/hyph-sk.tex"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
